# Deploy to AWS from CI (T-505, docs/DEPLOYMENT.md section 8).
#
# - Manual only (workflow_dispatch). A push trigger is deliberately not enabled:
#   nothing is deployed yet, and every push would fail until the repository
#   variables below exist. Add `push: branches: [main]` once they do.
# - AWS access comes from GitHub's OIDC token. There are no AWS keys in GitHub.
# - The plan job runs first and shows the plan. The apply job then waits for the
#   required reviewers of the `production` environment and applies exactly that
#   saved plan.
# - Third-party actions are pinned to full commit SHAs (docs/SECURITY.md TM-10).
#
# One-time setup (maintainer): docs/DEPLOYMENT.md section 8.
#   Repository variables: AWS_DEPLOY_ROLE_ARN, AWS_REGION, TF_STATE_BUCKET.
#   Environments: `production-plan` (no reviewers) and `production` (required
#   reviewers), both limited to the main branch.
name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false # never interrupt an apply

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VERSION: 1.16.5 # the version ci.yml checks with
  STATE_KEY: mergeguard/terraform.tfstate

jobs:
  plan:
    name: Terraform plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production-plan
    permissions:
      contents: read
      id-token: write # lets the job request a GitHub OIDC token for AWS
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the repository variables
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          for name in AWS_DEPLOY_ROLE_ARN AWS_REGION TF_STATE_BUCKET; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository variable $name is not set (docs/DEPLOYMENT.md section 8)."
              exit 1
            fi
          done

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Assume the deploy role through OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: mergeguard-plan

      - name: Select the S3 backend
        run: |
          cat > terraform/backend_override.tf <<'EOF'
          terraform {
            backend "s3" {}
          }
          EOF

      - name: Init with the committed lock file
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          terraform -chdir=terraform init -input=false -lockfile=readonly \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Plan
        run: terraform -chdir=terraform plan -input=false -lock-timeout=120s -out=tfplan

      - name: Show the plan
        run: |
          terraform -chdir=terraform show -no-color tfplan > plan.txt
          {
            echo '## Terraform plan'
            echo
            echo '```'
            head -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the plan for the apply job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfplan
          path: |
            terraform/tfplan
            terraform/build/lambda.zip
          if-no-files-found: error
          retention-days: 1

  apply:
    name: Terraform apply (needs approval)
    needs: plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production # required reviewers approve here
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Assume the deploy role through OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: mergeguard-apply

      - name: Get the reviewed plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tfplan
          path: terraform

      - name: Select the S3 backend
        run: |
          cat > terraform/backend_override.tf <<'EOF'
          terraform {
            backend "s3" {}
          }
          EOF

      - name: Init with the committed lock file
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          terraform -chdir=terraform init -input=false -lockfile=readonly \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Apply the saved plan
        run: terraform -chdir=terraform apply -input=false -lock-timeout=120s tfplan

      - name: Show the webhook URL
        run: |
          {
            echo '## Deployed'
            echo
            echo "Webhook URL: $(terraform -chdir=terraform output -raw github_webhook_url)"
          } >> "$GITHUB_STEP_SUMMARY"
